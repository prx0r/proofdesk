<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProofDesk — Live Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;line-height:1.6}
code,.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:1100px;margin:0 auto;padding:2rem 1.5rem;min-height:100vh;display:flex;flex-direction:column}
.hero{text-align:center;padding:3rem 0 2rem;transition:all .3s}
.hero h1{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.15;max-width:650px;margin:0 auto}
.hero .hl{color:#f59e0b}
.hero p{font-size:.95rem;color:#94a3b8;max-width:520px;margin:12px auto 0}
.btn{padding:10px 28px;border-radius:8px;font-size:.88rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-g{background:#059669;color:#fff}.btn-g:hover{background:#047857}.btn:disabled{opacity:.4;cursor:not-allowed}
.log-area{background:#0a0e14;border:1px solid #1e293b;border-radius:8px;padding:.75rem 1rem;font-family:'JetBrains Mono',monospace;font-size:.65rem;line-height:1.8;max-height:70vh;overflow-y:auto;flex:1;white-space:pre-wrap;word-break:break-all}
.log-area .ts{color:#484f58}.log-area .info{color:#60a5fa}.log-area .ok{color:#34d399}.log-area .err{color:#f87171}.log-area .warn{color:#fbbf24}.log-area .api{color:#a78bfa}.log-area .dim{color:#475569}.log-area .req{color:#f59e0b}.log-area .res{color:#06b6d4}
.step{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:1rem 1.25rem;margin-bottom:.75rem;opacity:0;transform:translateY(8px);transition:all .3s}
.step.active{opacity:1;transform:translateY(0);border-color:#f59e0b}
.step.done{opacity:1;transform:translateY(0);border-color:#334155}
.step-num{font-size:.55rem;text-transform:uppercase;letter-spacing:1px;color:#64748b;font-weight:600;margin-bottom:.4rem}
.step-title{font-size:.9rem;font-weight:700;color:#f8fafc;margin-bottom:.4rem}
.step-body{font-family:'JetBrains Mono',monospace;font-size:.7rem;line-height:1.7;color:#94a3b8;white-space:pre-wrap}
.step-body .ok{color:#34d399}.step-body .err{color:#f87171}.step-body .api{color:#a78bfa}.step-body .sys{color:#60a5fa}
.final{background:linear-gradient(135deg,#7c2d12,#92400e);border:2px solid #f59e0b;border-radius:12px;padding:2rem;text-align:center;margin-top:1.5rem;animation:fadeIn .4s}
.final h2{font-size:1.5rem;font-weight:800;color:#fde68a;margin-bottom:.5rem}
.final p{color:#fcd34d;font-size:.9rem}
.done-box{background:#0f172a;border:1px solid #1e293b;border-radius:6px;padding:.75rem 1rem;margin-top:.75rem;font-size:.72rem;color:#94a3b8;line-height:1.7}
.done-box pre{white-space:pre-wrap;font-size:.7rem;color:#94a3b8;margin:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.facts-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.75rem}
.fact-card{background:#0f172a;border:1px solid #1e293b;border-radius:6px;padding:.6rem .8rem}
.fact-card .field{font-size:.55rem;text-transform:uppercase;letter-spacing:.8px;color:#64748b;font-weight:600}
.fact-card .val{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:#f8fafc;margin-top:.2rem}
.fact-card .meta{font-size:.55rem;color:#475569;margin-top:.15rem}
.gate-box{background:#1e0a0a;border:2px solid #dc2626;border-radius:8px;padding:1rem 1.25rem;margin-top:.75rem;text-align:center}
.gate-box.pass{background:#0a1e0a;border-color:#059669}
.gate-box h3{font-size:1rem;font-weight:800;letter-spacing:1px}
.gate-box.denied{color:#f87171}.gate-box.allowed{color:#34d399}
</style>
</head>
<body>
<div class="wrap">
<div class="hero" id="hero">
  <h1>Nutrient reads the docs.<br><span class="hl">ProofDesk decides if it's safe to act.</span></h1>
  <p>4 real PDFs. Live Nutrient DWS extraction. Cross-document contradiction. Authority gate blocks. Human resolves.</p>
  <button class="btn btn-g" id="run-btn" onclick="runDemo()" style="margin-top:1.5rem">Run Live Case</button>
</div>

<div id="live-area" style="display:none">
  <div class="log-area" id="log-area"></div>
  <div id="steps-area" style="margin-top:1rem"></div>
  <div id="final-box"></div>
</div>
</div>

<script>
var API='https://fired-asset-applies-place.trycloudflare.com';
var logEl;
function ts(){return new Date().toISOString().slice(11,23)}
function log(cls,text){if(!logEl)return;logEl.innerHTML+='<span class="ts">['+ts()+']</span> <span class="'+cls+'">'+text+'</span>\n';logEl.scrollTop=logEl.scrollHeight;}
function logSep(){log('dim','────────────────────────────────────────');}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

function renderStep(num,title,bodyHtml,done){
  return '<div class="step '+(done?'done':'active')+'"><div class="step-num">Step '+num+'</div><div class="step-title">'+title+'</div><div class="step-body">'+bodyHtml+'</div></div>';
}

function fmtTime(ms){return ms>1000?(ms/1000).toFixed(1)+'s':Math.round(ms)+'ms';}

async function api(method,path,body){
  var opts={method:method,headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  var t0=performance.now();
  var res=await fetch(API+path,opts);
  var ms=performance.now()-t0;
  var data=await res.json().catch(function(){return{}});
  return{ok:res.ok,status:res.status,data:data,ms:ms};
}

async function runDemo(){
  var btn=document.getElementById('run-btn');
  btn.disabled=true;btn.textContent='Running...';
  document.getElementById('hero').style.display='none';
  document.getElementById('live-area').style.display='block';
  document.getElementById('steps-area').innerHTML='';
  document.getElementById('final-box').innerHTML='';
  logEl=document.getElementById('log-area');
  logEl.innerHTML='';

  log('info','<strong>ProofDesk — live Nutrient DWS pipeline</strong>');
  logSep();

  try{
    // 1. Create fixture case (4 real PDFs)
    log('req','POST /v1/cases/fixture');
    var r=await api('POST','/v1/cases/fixture');
    log('res',r.status+' OK ('+fmtTime(r.ms)+')');
    log('ok','case_id: '+r.data.case_id+' — '+r.data.documents+' documents loaded');
    var caseId=r.data.case_id;
    logSep();

    // 2. Run pipeline (4 live Nutrient DWS calls)
    log('req','POST /v1/cases/'+caseId+'/run');
    log('info','Sending 4 PDFs to Nutrient DWS...');
    r=await api('POST','/v1/cases/'+caseId+'/run',{domain:'procurement'});
    log('res',r.status+' ('+fmtTime(r.ms)+')');
    log('ok','state: '+r.data.state+' — blocking_exceptions: '+r.data.blocking_exceptions);

    // Get trace for API call details
    var trace=await api('GET','/v1/cases/'+caseId+'/trace');
    var calls=trace.data.calls||[];
    for(var i=0;i<calls.length;i++){
      var c=calls[i];
      log('api','  '+c.provider+' '+c.operation+' → '+fmtTime(c.duration_ms));
    }
    logSep();

    // 3. Show extracted facts
    var factsResp=await api('GET','/v1/cases/'+caseId+'/facts');
    var facts=factsResp.data.facts||[];
    log('ok','<strong>'+facts.length+' facts extracted</strong> with confidence + source page');
    var step3Body='<span class="ok">Nutrient DWS returned '+facts.length+' grounded facts</span>\n';
    step3Body+='<div class="facts-grid">';
    var keyFields=['procurement.required_coverage_until','insurance.expiry_date','vendor.legal_name','procurement.requested_spend'];
    for(var fi=0;fi<facts.length;fi++){
      var f=facts[fi];
      if(keyFields.indexOf(f.field)>=0){
        var conf=f.confidence!==null&&f.confidence!==undefined?(f.confidence*100).toFixed(0)+'%':'N/A';
        step3Body+='<div class="fact-card"><div class="field">'+esc(f.field)+'</div><div class="val">'+esc(f.value_normalized||f.value_raw)+'</div><div class="meta">conf '+conf+' · page '+(f.source_page||'—')+'</div></div>';
      }
    }
    step3Body+='</div>';
    document.getElementById('steps-area').innerHTML+=renderStep(1,'Nutrient DWS extracts grounded evidence',step3Body,true);
    logSep();

    // 4. Cross-document check
    var assertResp=await api('GET','/v1/cases/'+caseId+'/assertions');
    var assertions=assertResp.data.assertions||[];
    var blocking=assertions.filter(function(a){return a.result==='FAIL'&&a.severity==='BLOCKER'});
    var step4Body='<span class="api">'+assertions.length+' cross-document checks</span>\n';
    for(var ai=0;ai<assertions.length;ai++){
      var a=assertions[ai];
      var icon=a.result==='PASS'?'<span class="ok">✓</span>':'<span class="err">✗</span>';
      step4Body+=icon+' '+a.predicate+'\n';
    }
    log('ok',assertions.length+' assertions — '+blocking.length+' blockers');
    document.getElementById('steps-area').innerHTML+=renderStep(2,'Cross-document verification',step4Body,true);
    logSep();

    // 5. Authority gate
    var gateResp=await api('GET','/v1/cases/'+caseId+'/signature-gate');
    var gate=gateResp.data;
    var gateClass=gate.allowed?'pass':'';
    var gateText=gate.allowed?'EXECUTION AUTHORIZED':'EXECUTION BLOCKED';
    var gateColor=gate.allowed?'allowed':'denied';
    var step5Body='<div class="gate-box '+gateClass+'"><h3 class="'+gateColor+'">'+gateText+'</h3></div>\n';
    if(!gate.allowed&&gate.reasons){
      for(var ri=0;ri<gate.reasons.length;ri++){
        var reason=gate.reasons[ri];
        step5Body+='<span class="err">  ✗ '+reason.code+': '+reason.detail+'</span>\n';
      }
    }
    log(gate.allowed?'ok':'err','Authority Gate: '+gateText);
    document.getElementById('steps-area').innerHTML+=renderStep(3,'Authority Gate',step5Body,true);
    logSep();

    // 6. Human resolution
    if(blocking.length>0){
      log('info','Human reviewing...');
      for(var bi=0;bi<blocking.length;bi++){
        var b=blocking[bi];
        log('req','POST /v1/cases/'+caseId+'/resolve');
        var resolveResp=await api('POST','/v1/cases/'+caseId+'/resolve',{
          assertion_id:b.assertion_id,
          decision:'CONDITIONAL_ACCEPT',
          reason:'Vendor must provide renewed certificate before execution',
          actor_id:'procurement-reviewer'
        });
        log('res',resolveResp.status+' ('+fmtTime(resolveResp.ms)+')');
        log('ok','Resolved: '+b.assertion_id+' → CONDITIONAL_ACCEPT');
      }
      var step6Body='<span class="ok">procurement-reviewer resolved '+blocking.length+' blocker(s)</span>\n';
      step6Body+='Decision: CONDITIONAL_ACCEPT\n';
      step6Body+='Reason: Vendor must provide renewed certificate before execution';
      document.getElementById('steps-area').innerHTML+=renderStep(4,'Human resolves blocker',step6Body,true);
      logSep();
    }

    // 7. Re-run + approve
    log('req','POST /v1/cases/'+caseId+'/run');
    await api('POST','/v1/cases/'+caseId+'/run',{domain:'procurement'});

    log('req','POST /v1/cases/'+caseId+'/approve');
    var approveResp=await api('POST','/v1/cases/'+caseId+'/approve?actor_id=procurement-reviewer');
    log('res',approveResp.status+' ('+fmtTime(approveResp.ms)+')');
    log('ok','record_hash: '+approveResp.data.record_hash);
    var step7Body='<span class="ok">Record approved</span>\nrecord_hash: '+approveResp.data.record_hash;
    document.getElementById('steps-area').innerHTML+=renderStep(5,'Approved record sealed',step7Body,true);
    logSep();

    // 8. Generate
    log('req','POST /v1/cases/'+caseId+'/generate');
    var genResp=await api('POST','/v1/cases/'+caseId+'/generate');
    log('res',genResp.status+' ('+fmtTime(genResp.ms)+')');
    log('ok','artifact_id: '+genResp.data.artifact_id);

    // Get receipt
    var receipt=await api('GET','/v1/cases/'+caseId+'/receipt');
    var rd=receipt.data;
    var step8Body='<span class="ok">Artifact generated</span>\n';
    step8Body+='facts: '+rd.facts_extracted+'  assertions: '+rd.assertions_checked+'  resolutions: '+rd.resolutions+'\n';
    step8Body+='record_hash: '+rd.record_hash+'\n';
    step8Body+='artifact_hash: '+rd.artifact_hash;
    document.getElementById('steps-area').innerHTML+=renderStep(6,'Document generated from approved record',step8Body,true);
    logSep();

    // 9. Audit chain
    var chain=await api('GET','/v1/audit/chain');
    log('ok','Audit chain: '+chain.data.detail);
    var step9Body='<span class="ok">'+chain.data.detail+'</span>\n';
    step9Body+='events: '+chain.data.stats.total_events+'  epochs: '+chain.data.stats.total_epochs;
    document.getElementById('steps-area').innerHTML+=renderStep(7,'Audit trail verified',step9Body,true);

    // Final
    document.getElementById('final-box').innerHTML=
      '<div class="final">'+
      '<h2>Authority Gate: BLOCKED → Human Resolved → Approved</h2>'+
      '<p>'+facts.length+' Nutrient DWS facts · '+assertions.length+' assertions · '+rd.record_hash+' · '+chain.data.detail+'</p>'+
      '</div>';

  }catch(e){
    log('err','FATAL: '+e.message);
    document.getElementById('steps-area').innerHTML=renderStep(1,'Error','<span class="err">'+e.message+'</span>',false);
  }
  btn.disabled=false;btn.textContent='Run Again';
}
</script>
</body>
</html>
